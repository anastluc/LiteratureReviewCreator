# Default configuration. Override per project in projects/<slug>/config.toml.

[paths]
projects_dir = "projects"
pdf_cache_dir = "library/pdfs"
browser_profile_dir = "~/.litkb/browser-profile"

[llm.synthesis]           # report writing, RAG answers
provider = "anthropic"    # anthropic | openai_compatible
model = "claude-opus-5-5"

[llm.fast]                # RQ drafting, cluster labels
provider = "anthropic"
model = "claude-sonnet-5-5"

[llm.openai_compatible]
base_url = "http://localhost:1234/v1"   # LM Studio / Ollama / OpenAI

[rq]
min_questions = 3
max_questions = 6

[merge]
title_match_threshold = 93      # rapidfuzz token_sort_ratio for title-based dedupe / OpenAlex matching
openalex_batch_size = 50

[retrieve]
source_order = ["unpaywall", "openalex", "semantic_scholar", "arxiv", "biorxiv", "browser"]
concurrency = 4
per_host_delay_s = 1.0
timeout_s = 60
min_pdf_bytes = 10000
title_check_threshold = 60      # rapidfuzz partial_ratio of title vs. first-page text
browser_enabled = true
browser_headless = false        # publishers block headless browsers more often
browser_delay_s = 20
browser_max_per_hour = 60

[parse]
grobid_url = "http://localhost:8070"
timeout_s = 300
concurrency = 2

[embed]
paper_model = "allenai/specter2_base"
paper_adapter = "allenai/specter2"
chunk_model = "BAAI/bge-base-en-v1.5"
device = "cpu"
batch_size = 16

[chunk]
target_tokens = 600
overlap_tokens = 80
min_tokens = 60
drop_sections = ["references", "acknowledgement", "acknowledgements", "acknowledgments", "funding",
                 "conflict of interest", "competing interests", "author contributions"]

[map]
pca_dims = 50
tsne_perplexity = 30
umap_neighbors = 15
cluster_dims = 10
hdbscan_min_cluster_size = 8
label_top_papers = 12

[query]
top_k = 12
hybrid = true
rrf_k = 60

[report]
evidence_chunks_per_rq = 40
evidence_chunks_per_cluster = 20
max_tokens_section = 6000
